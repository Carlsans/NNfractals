name = "explore-wide"
notes = """
"Show me things I haven't seen." Every diversity channel is pushed hard:
behavioural novelty, formula-family diversity, distance from everything already
saved, and a heavier penalty on formula families that already dominate the
gallery. Taste weight and the taste floor are pulled back so unusual results
are not filtered out before you get to look at them.

Expect a noisier, more uneven gallery with occasional genuine surprises. Best
run for a few hours, then switch back — sustained high novelty pressure tends
to drift toward the merely weird.

archive_seeding_enabled is NOT set here (profiles only carry fitness weights).
If you want restarts to reseed from the archive rather than from random, that is
still a config.toml setting.
"""

# ── selection ──
entropy_weight           = 1.0
novelty_weight           = 0.90
formula_diversity_weight = 0.90
ood_weight               = 0.50
angle_structure_weight   = 0.0
recursion_pred_weight    = 0.0
clip_pred_weight         = 0.0
complexity_penalty       = 0.008
duplicate_penalty_weight = 0.80

# ── saved fitness + seeding ──
pref_weight              = 0.15
musiq_weight             = 0.15
img_novelty_weight       = 0.0
seed_pref_weight         = 1.0
seed_aesthetic_weight    = 1.0
seed_laion_weight        = 0.15
self_replication_weight  = 0.35
fractal_recursion_weight = 0.35

# ── save gate ──
min_ensemble          = 4.6
min_entropy_prefilter = 0.38
max_entropy_prefilter = 0.70
min_save_distance     = 0.05
min_beauty            = 0.35
min_musiq             = 50.0
min_pref              = 0.40
