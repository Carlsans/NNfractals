name = "taste-led"
notes = """
"More of what I already like." Preference dominates both the saved fitness and
the seed ranking, the taste floor at the gate is raised, and the exploration
pressure that pulls away from known-good territory is cut back.

Expect fewer saves and a tighter, more consistent gallery. If the pool starts
looking samey, that is this profile working as designed — switch to
`explore-wide` for a while.

Requires a trained preference model (browser Rate mode + scripts/train_pref.py).
Without one, pref_score is 0 and this profile degenerates into a weak version of
`current` with a lower diversity pressure.
"""

