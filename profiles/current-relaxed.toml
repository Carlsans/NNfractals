name = "current-relaxed"
notes = """
config3.toml / config4.toml's mix. Two deltas from `current-no-imgnovelty`:
formula diversity 0.45 instead of 0.60, and the MUSIQ floor at 50 instead of
58.

Those two configs are byte-identical apart from their pool directories, so this
one profile covers both. Lower gates mean a higher save rate at slightly lower
median quality — useful for filling a new pool quickly.
"""

